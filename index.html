<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Quiz Night</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Poppins", ui-sans-serif, system-ui, -apple-system,
          "Segoe UI", Roboto, "Helvetica Neue", Arial;
      }
    </style>
  </head>
  <body
    class="min-h-screen bg-gray-900 text-gray-100 flex items-center justify-center p-6"
  >
    <main
      class="w-full max-w-2xl bg-gradient-to-br from-gray-800 to-gray-700/60 shadow-lg rounded-2xl p-8 md:p-12"
    >
      <header class="mb-6">
        <h1 class="text-3xl font-semibold text-center">Rounds</h1>
      </header>

      <nav class="grid gap-4">
        <a
          href="music/index.html"
          class="block bg-pink-600 hover:bg-pink-500 text-white rounded-lg px-4 py-3 shadow text-center"
          >Music</a
        >
        <a
          href="photos/index.html"
          class="block bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg px-4 py-3 shadow text-center"
          >Photos</a
        >
      </nav>
    </main>
  </body>
</html>
