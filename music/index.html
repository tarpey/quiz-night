<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Music Round</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Use Poppins for the UI */
      body {
        font-family: "Poppins", ui-sans-serif, system-ui, -apple-system,
          "Segoe UI", Roboto, "Helvetica Neue", Arial;
      }
      /* (glitter ball removed) */
      /* Answer fade animation */
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .fade-in {
        animation: fadeIn 260ms cubic-bezier(0.2, 0.9, 0.3, 1) both;
      }
      @keyframes fadeOut {
        from {
          opacity: 1;
          transform: translateY(0);
        }
        to {
          opacity: 0;
          transform: translateY(6px);
        }
      }
      .fade-out {
        animation: fadeOut 260ms cubic-bezier(0.2, 0.9, 0.3, 1) both;
      }

      /* Redaction: heavy animated blur + dark overlay to fully obscure text.
         Transitions animate the blur and overlay opacity over 1s when
         revealing or hiding the answer. */
      #answer {
        position: relative; /* animate filter changes */
        transition: filter 1000ms ease, -webkit-filter 1000ms ease;
        padding-top: 0.75rem; /* extra spacing above */
        padding-bottom: 0.75rem; /* extra spacing below */
      }

      /* baseline overlay pseudo-element (always present) so opacity can be animated */
      #answer::after {
        content: "";
        position: absolute;
        inset: 0;
        background: rgba(0, 6, 20, 0.94);
        pointer-events: none;
        z-index: 3;
        opacity: 0;
        transition: opacity 1000ms ease;
      }

      /* apply the heavy blur and reveal the overlay when redacted */
      .redacted {
        filter: blur(14px) saturate(0.6) contrast(0.85);
        -webkit-filter: blur(14px) saturate(0.6) contrast(0.85);
      }
      .redacted::after {
        opacity: 1;
      }

      /* helper to disable transitions when we need to immediately redact (e.g., on track change) */
      #answer.no-transition {
        transition: none !important;
        -webkit-transition: none !important;
      }
      #answer.no-transition::after {
        transition: none !important;
      }
      /* Vinyl spinner styles */
      @keyframes spin {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }
      #vinyl {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        background: radial-gradient(
          circle at 35% 35%,
          #444 0 12%,
          #000 14% 60%
        );
        box-shadow: inset 0 2px 6px rgba(255, 255, 255, 0.03),
          0 4px 10px rgba(0, 0, 0, 0.6);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #vinyl .spindle {
        width: 6px;
        height: 6px;
        background: #f472b6;
        border-radius: 50%;
      }
      #vinyl.spin {
        animation: spin 3s linear infinite;
      }
    </style>
  </head>
  <body
    class="min-h-screen bg-gray-900 text-gray-100 flex items-center justify-center p-6"
  >
    <main
      class="w-full max-w-2xl bg-gradient-to-br from-gray-800 to-gray-700/60 shadow-lg rounded-2xl p-6 md:p-10"
    >
      <div class="mb-4 text-sm">
        <a
          href="../index.html"
          class="text-gray-300 hover:text-gray-100 hover:underline"
          aria-label="Go back to homepage"
          >← Back</a
        >
      </div>

      <!-- <header class="flex items-center justify-between mb-6">
        <h1 class="text-2xl md:text-3xl font-semibold">Music Round</h1>
      </header> -->

      <section class="grid gap-4 md:items-end">
        <div class="md:col-span-3">
          <div class="flex flex-wrap items-center gap-4">
            <button
              id="playBtn"
              class="bg-pink-600 hover:bg-pink-500 active:scale-[0.99] text-white rounded-full w-12 h-12 flex items-center justify-center shadow"
              aria-label="Play"
            >
              <!-- play icon (replaced by JS when playing/paused) -->
              <svg
                id="playIcon"
                xmlns="http://www.w3.org/2000/svg"
                class="w-5 h-5"
                viewBox="0 0 24 24"
                fill="currentColor"
                aria-hidden="true"
              >
                <path d="M8 5v14l11-7z" />
              </svg>
            </button>

            <div class="flex-1">
              <select
                id="trackSelect"
                class="w-full rounded-lg bg-gray-800 border border-gray-700 text-gray-100 p-3 focus:outline-none focus:ring-2 focus:ring-pink-500"
              ></select>
            </div>

            <button
              id="revealBtn"
              class="bg-pink-600 hover:bg-pink-500 active:scale-[0.99] text-white rounded-lg px-4 py-3 shadow w-full sm:w-auto mt-3 sm:mt-0"
            >
              Show Answer
            </button>
          </div>
        </div>
      </section>

      <div
        id="answer"
        class="mt-6 text-center text-4xl md:text-6xl font-bold text-pink-400"
      ></div>

      <!-- Playback progress + simple equalizer -->
      <section class="mt-6">
        <div class="flex items-center gap-3">
          <div
            id="progressBar"
            class="w-full bg-gray-700 h-2 rounded overflow-hidden cursor-pointer"
          >
            <div
              id="progressFill"
              class="h-2 bg-pink-500 w-0 transition-all duration-150"
            ></div>
          </div>
          <div id="timeLabel" class="text-xs text-gray-300 w-28 text-right">
            0:00 / 0:00
          </div>
        </div>

        <div class="mt-3 flex items-center gap-3">
          <!-- <div class="flex items-center gap-3">
              <span id="playingLabel" class="text-sm text-gray-300">Stopped</span>
            </div>
          </div> -->

          <div class="w-full mt-4 flex items-center justify-center gap-3">
            <button
              id="prevBtn"
              class="bg-gray-800 hover:bg-gray-700 text-gray-100 rounded-lg px-4 py-2 shadow flex-1"
            >
              ‹ Prev
            </button>
            <button
              id="nextBtn"
              class="bg-gray-800 hover:bg-gray-700 text-gray-100 rounded-lg px-4 py-2 shadow flex-1"
            >
              Next ›
            </button>
          </div>
        </div>
      </section>

      <audio id="player"></audio>
    </main>

    <script>
      const player = document.getElementById("player");
      const select = document.getElementById("trackSelect");
      const answerBox = document.getElementById("answer");
      const playBtn = document.getElementById("playBtn");
      const progressFill = document.getElementById("progressFill");
      const timeLabel = document.getElementById("timeLabel");
      const playingLabel = document.getElementById("playingLabel");
      const progressBar = document.getElementById("progressBar");

      // Tracks definition: add new entries here to expand the list
      // Each option will be shown as "Track X" where X is the 1-based index
      const TRACKS = [
        {
          file: "Track1.mp3",
          title: "Perfect 10",
          artist: "The Beautiful South",
        },
        {
          file: "Track2.mp3",
          title: "September",
          artist: "Earth, Wind & Fire",
        },
        {
          file: "Track3.mp3",
          title: "Hold On Tight",
          artist: "Electric Light Orchestra",
        },
        { file: "Track4.mp3", title: "Everybody Dance", artist: "CHIC" },
        { file: "Track5.mp3", title: "Doo Wah Diddy", artist: "Manfred Mann" },
        {
          file: "Track6.mp3",
          title: "Hallelujah I Love Her So",
          artist: "Ray Charles",
        },
        {
          file: "Track7.mp3",
          title: "A Thousand Miles",
          artist: "Vanessa Carlton",
        },
        {
          file: "Track8.mp3",
          title: "Boom! Shake The Room",
          artist: "DJ Jazzy Jeff & The Fresh Prince",
        },
        {
          file: "Track9.mp3",
          title: "Paradise By The Dashboard Light",
          artist: "Meat Loaf",
        },
        { file: "Track10.mp3", title: "Need You Tonight", artist: "INXS" },
      ];

      // Populate the select from TRACKS so it's easier to update later
      (function populateTracks() {
        if (!select) return;
        select.innerHTML = "";
        TRACKS.forEach((t, idx) => {
          const opt = document.createElement("option");
          opt.value = t.file;
          // display as "Track X" where X is the 1-based index
          opt.textContent = `Track ${idx + 1}`;
          if (t.title) opt.dataset.title = t.title;
          if (t.artist) opt.dataset.artist = t.artist;
          select.appendChild(opt);
        });
        // keep first track selected by default
        if (select.options.length) select.selectedIndex = 0;
      })();

      // Redact the initial answer for the selected track on load
      redactAnswer();

      // SVG icons for play/pause
      const PLAY_SVG =
        '<svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>';
      const PAUSE_SVG =
        '<svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>';

      function formatTime(seconds) {
        if (!isFinite(seconds)) return "0:00";
        const s = Math.floor(seconds % 60)
          .toString()
          .padStart(2, "0");
        const m = Math.floor(seconds / 60);
        return `${m}:${s}`;
      }

      // Play / pause toggle. If a new track is chosen, load from start.
      playBtn.onclick = () => {
        const file = select.value;
        if (player.dataset.file !== file) {
          player.src = `files/${file}`;
          player.dataset.file = file;
          player.currentTime = 0;
        }
        if (player.paused) player.play();
        else player.pause();
      };

      function selectAndPlay(index) {
        const len = select.options.length;
        if (len === 0) return;
        const wrapped = ((index % len) + len) % len;
        select.selectedIndex = wrapped;

        // Reset reveal/answer UI: redact the answer (animated)
        redactAnswerAnimated();
        const revealBtn = document.getElementById("revealBtn");
        revealBtn.textContent = "👀 Reveal Answer";
        revealBtn.setAttribute("aria-pressed", "false");

        // Load and play the selected file
        const opt = select.selectedOptions[0];
        const file = opt.value;
        try {
          player.pause();
          player.currentTime = 0;
        } catch (e) {}
        player.src = `tracks/${file}`;
        player.dataset.file = file;
        player.play();
      }

      // prev/next controls removed — navigation can be done with the select

      // Update reveal button behavior (toggle) kept as before
      // Redaction helper: show the answer text but covered by overlay
      function redactAnswer() {
        const opt = select.selectedOptions[0];
        const title = opt ? opt.dataset.title : "";
        const artist = opt ? opt.dataset.artist : "";
        // Show title on one line and artist below it
        answerBox.innerHTML =
          `${title ? `<div class="answer-title mb-2">${title}</div>` : ""}` +
          `${
            artist
              ? `<div class="answer-artist text-2xl text-gray-300">${artist}</div>`
              : ""
          }`;
        // clear any reveal animation classes and apply redaction immediately
        // disable transitions briefly so the redaction is instant on load
        answerBox.classList.add("no-transition");
        answerBox.classList.remove("fade-in");
        answerBox.classList.add("redacted");
        // force a reflow so the no-transition takes effect, then restore transitions
        requestAnimationFrame(() => {
          requestAnimationFrame(() =>
            answerBox.classList.remove("no-transition")
          );
        });
      }

      // Reveal animation: slide the overlay away and then remove the overlay class
      function revealAnswerAnimated() {
        if (!answerBox.classList.contains("redacted")) return;
        // removing the `.redacted` class will animate the blur/overlay over 3s
        answerBox.classList.remove("redacted");
      }

      // Re-apply redaction with an entry animation
      function redactAnswerAnimated() {
        // ensure text present
        const opt = select.selectedOptions[0];
        const title = opt ? opt.dataset.title : "";
        const artist = opt ? opt.dataset.artist : "";
        answerBox.innerHTML =
          `${title ? `<div class="answer-title">${title}</div>` : ""}` +
          `${
            artist
              ? `<div class="answer-artist text-sm text-gray-300">${artist}</div>`
              : ""
          }`;
        // animate into the redacted state over 3s
        answerBox.classList.remove("fade-in");
        // ensure transitions are enabled so the blur animates in
        answerBox.classList.remove("no-transition");
        // apply redacted which will animate filter & overlay opacity over 3s
        // (previously we used an immediate redaction; here we animate)
        // For selection changes we use a temporary no-transition elsewhere.
        answerBox.classList.add("redacted");
      }

      document.getElementById("revealBtn").onclick = (e) => {
        const btn = e.currentTarget;
        const isCurrentlyRedacted =
          answerBox.classList.contains("redacted") ||
          answerBox.classList.contains("redacting");
        if (isCurrentlyRedacted) {
          // reveal
          revealAnswerAnimated();
          btn.textContent = "Hide Answer";
          btn.setAttribute("aria-pressed", "true");
        } else {
          // redact again (animated)
          redactAnswerAnimated();
          btn.textContent = "Show Answer";
          btn.setAttribute("aria-pressed", "false");
        }
      };

      // Playback UI updates
      player.addEventListener("play", () => {
        // swap to pause icon + accessible label
        playBtn.innerHTML = PAUSE_SVG;
        playBtn.setAttribute("aria-label", "Pause");
        playingLabel.textContent = "Playing";
      });
      player.addEventListener("pause", () => {
        playBtn.innerHTML = PLAY_SVG;
        playBtn.setAttribute("aria-label", "Play");
        playingLabel.textContent = "Paused";
      });
      player.addEventListener("ended", () => {
        playBtn.innerHTML = PLAY_SVG;
        playBtn.setAttribute("aria-label", "Play");
        playingLabel.textContent = "Finished";
      });

      // Hide answer when user changes selected track, reset reveal button,
      // and stop/reset playback + progress UI
      select.addEventListener("change", () => {
        // Immediately redact the answer when selection changes to avoid
        // briefly showing the previous answer while the blur animates in.
        redactAnswer();
        const revealBtn = document.getElementById("revealBtn");
        revealBtn.textContent = "👀 Reveal Answer";
        revealBtn.setAttribute("aria-pressed", "false");

        // Stop playback and reset player state
        try {
          player.pause();
          player.currentTime = 0;
          // Unload source so the new track isn't auto-played when the user
          // changes the selection directly.
          player.removeAttribute("src");
          player.dataset.file = "";
          player.load();
        } catch (e) {
          // ignore
        }

        // Reset progress UI
        progressFill.style.width = "0%";
        timeLabel.textContent = "0:00 / 0:00";
        playingLabel.textContent = "Stopped";
        playBtn.innerHTML = PLAY_SVG;
        playBtn.setAttribute("aria-label", "Play");
        // ensure answer animation is reset when changing tracks
        answerBox.classList.remove("fade-in");
      });

      // Prev / Next change the dropdown selection (do not autoplay)
      const prevBtn = document.getElementById("prevBtn");
      const nextBtn = document.getElementById("nextBtn");
      if (prevBtn)
        prevBtn.addEventListener("click", () => {
          const len = select.options.length;
          if (!len) return;
          select.selectedIndex = (select.selectedIndex - 1 + len) % len;
          select.dispatchEvent(new Event("change"));
        });
      if (nextBtn)
        nextBtn.addEventListener("click", () => {
          const len = select.options.length;
          if (!len) return;
          select.selectedIndex = (select.selectedIndex + 1) % len;
          select.dispatchEvent(new Event("change"));
        });

      player.addEventListener("timeupdate", () => {
        const pct = player.duration
          ? (player.currentTime / player.duration) * 100
          : 0;
        progressFill.style.width = pct + "%";
        timeLabel.textContent = `${formatTime(
          player.currentTime
        )} / ${formatTime(player.duration)}`;
      });

      // Seek by clicking the progress bar
      progressBar.addEventListener("click", (e) => {
        if (!player.duration) return;
        const rect = progressBar.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const ratio = Math.max(0, Math.min(1, x / rect.width));
        player.currentTime = ratio * player.duration;
      });
    </script>
  </body>
</html>
